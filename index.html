<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
  <meta name="theme-color" content="#c8553d" />
  <meta name="description" content="《算得快》刘后一著 · 22章节132道速算练习题，含完形填空、单选、多选三种题型，每题附详细解题思路" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="算得快练习" />
  <title>《算得快》练习题 · 刘后一</title>
  <style>
/* ===== 全局变量 ===== */
:root {
  --bg: #f5f1e8;
  --bg-card: #ffffff;
  --ink: #2d2418;
  --ink-soft: #5a4d3c;
  --primary: #c8553d;
  --primary-dark: #9c3d28;
  --accent: #588157;
  --accent-soft: #e9f0e3;
  --gold: #d4a24c;
  --gold-soft: #f8edd5;
  --border: #e0d6c2;
  --shadow: 0 4px 12px rgba(94, 70, 35, 0.08);
  --shadow-lg: 0 8px 24px rgba(94, 70, 35, 0.12);
  --radius: 14px;
  --radius-sm: 8px;
  --good: #588157;
  --bad: #c8553d;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}

/* ===== 布局 ===== */
.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.app-header {
  background: linear-gradient(135deg, #fff7e6 0%, #ffe8d1 60%, #ffd9b3 100%);
  border-bottom: 1px solid var(--border);
  padding: 32px 20px 28px;
  position: relative;
  overflow: hidden;
}

.app-header::before {
  content: "";
  position: absolute;
  top: -80px;
  right: -60px;
  width: 240px;
  height: 240px;
  background: radial-gradient(circle, rgba(212, 162, 76, 0.18), transparent 70%);
  border-radius: 50%;
}

.app-header::after {
  content: "";
  position: absolute;
  bottom: -60px;
  left: -40px;
  width: 180px;
  height: 180px;
  background: radial-gradient(circle, rgba(200, 85, 61, 0.12), transparent 70%);
  border-radius: 50%;
}

.header-inner {
  position: relative;
  max-width: 960px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 24px;
  align-items: center;
}

.book-badge {
  width: 110px;
  height: 150px;
  background: var(--primary);
  border-radius: 4px 12px 12px 4px;
  position: relative;
  color: #fff;
  padding: 14px 10px;
  text-align: center;
  box-shadow: 4px 4px 0 var(--gold), 8px 8px 0 var(--primary-dark);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.book-badge::before {
  content: "";
  position: absolute;
  left: -6px;
  top: 0;
  bottom: 0;
  width: 6px;
  background: linear-gradient(90deg, rgba(0,0,0,0.25), transparent);
  border-radius: 4px 0 0 4px;
}

.badge-title {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: 4px;
  writing-mode: vertical-rl;
  text-orientation: upright;
  margin: 0 auto;
  line-height: 1;
}

.badge-sub {
  font-size: 9px;
  line-height: 1.3;
  opacity: 0.85;
  margin-top: 6px;
}

.badge-author {
  font-size: 11px;
  font-weight: 600;
  border-top: 1px solid rgba(255,255,255,0.4);
  padding-top: 6px;
}

.app-title {
  font-size: 36px;
  font-weight: 800;
  color: var(--ink);
  margin-bottom: 4px;
  letter-spacing: 2px;
}

.app-subtitle {
  font-size: 15px;
  color: var(--ink-soft);
  margin-bottom: 18px;
}

.hero-stats {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
}

.stat {
  display: flex;
  flex-direction: column;
  background: rgba(255, 255, 255, 0.7);
  border: 1px solid var(--border);
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  min-width: 100px;
}

.stat-num {
  font-size: 22px;
  font-weight: 800;
  color: var(--primary);
}

.stat-label {
  font-size: 11px;
  color: var(--ink-soft);
  margin-top: 2px;
}

.app-main {
  flex: 1;
  max-width: 960px;
  width: 100%;
  margin: 0 auto;
  padding: 28px 20px 40px;
}

.app-footer {
  text-align: center;
  padding: 18px 20px;
  color: var(--ink-soft);
  font-size: 12px;
  border-top: 1px dashed var(--border);
}

/* ===== 视图切换 ===== */
.view {
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== 章节选择页 ===== */
.section-title {
  text-align: center;
  margin-bottom: 22px;
}

.section-title h2 {
  font-size: 22px;
  color: var(--ink);
  margin-bottom: 6px;
}

.section-title p {
  color: var(--ink-soft);
  font-size: 14px;
}

.chapter-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
}

.chapter-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 18px 16px;
  cursor: pointer;
  transition: all 0.2s ease;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.chapter-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
  border-color: var(--gold);
}

.chapter-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--primary), var(--gold));
  border-radius: var(--radius) var(--radius) 0 0;
}

.chapter-num {
  font-size: 11px;
  font-weight: 700;
  color: var(--primary);
  letter-spacing: 1.5px;
}

.chapter-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.4;
}

.chapter-sub {
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.4;
}

.chapter-difficulty {
  margin-top: 8px;
  display: flex;
  gap: 3px;
}

.star {
  color: var(--gold);
  font-size: 12px;
}

.star.empty {
  color: var(--border);
}

.footer-tip {
  text-align: center;
  margin-top: 28px;
  color: var(--ink-soft);
  font-size: 13px;
  padding: 14px;
  background: var(--gold-soft);
  border-radius: var(--radius);
  border: 1px dashed var(--gold);
}

/* ===== 答题页 ===== */
.quiz-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
  background: var(--bg-card);
  padding: 12px 16px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  flex-wrap: wrap;
}

.btn-back {
  display: flex;
  align-items: center;
  gap: 4px;
  color: var(--ink-soft);
  font-size: 14px;
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  transition: all 0.15s;
}

.btn-back:hover {
  background: var(--bg);
  color: var(--ink);
}

.back-arrow {
  font-size: 18px;
  line-height: 1;
}

.quiz-info {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.chapter-tag {
  background: var(--primary);
  color: #fff;
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 12px;
  font-weight: 600;
}

.quiz-progress {
  font-size: 14px;
  color: var(--ink-soft);
  font-weight: 600;
}

.quiz-stats {
  display: flex;
  gap: 12px;
  font-size: 14px;
  font-weight: 600;
}

.stat-correct {
  color: var(--good);
}

.stat-correct em, .stat-wrong em {
  font-style: normal;
  margin-left: 2px;
  font-size: 16px;
}

.stat-wrong {
  color: var(--bad);
}

.quiz-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  margin-bottom: 16px;
}

.question-type {
  display: inline-block;
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 10px;
  font-weight: 600;
  margin-bottom: 10px;
}

.type-cloze {
  background: var(--gold-soft);
  color: #8b6914;
}

.type-single {
  background: var(--accent-soft);
  color: #3d5a3d;
}

.type-multi {
  background: #f5e1e1;
  color: #8a3535;
}

.question-text {
  font-size: 18px;
  font-weight: 600;
  line-height: 1.6;
  margin-bottom: 18px;
  color: var(--ink);
}

.question-text .blank {
  display: inline-block;
  min-width: 60px;
  border-bottom: 2px solid var(--primary);
  text-align: center;
  padding: 0 8px;
  margin: 0 4px;
  color: var(--primary);
  font-weight: 700;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.option {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s;
  font-size: 15px;
  background: #fafaf6;
}

.option:hover:not(.disabled) {
  border-color: var(--gold);
  background: var(--gold-soft);
}

.option.selected {
  border-color: var(--primary);
  background: #fff0ec;
}

.option.correct {
  border-color: var(--good);
  background: var(--accent-soft);
  color: var(--good);
}

.option.wrong {
  border-color: var(--bad);
  background: #f5e1e1;
  color: var(--bad);
}

.option.disabled {
  cursor: not-allowed;
}

.option-letter {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #fff;
  border: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
  flex-shrink: 0;
}

.option.selected .option-letter {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}

.option.correct .option-letter {
  background: var(--good);
  border-color: var(--good);
  color: #fff;
}

.option.wrong .option-letter {
  background: var(--bad);
  border-color: var(--bad);
  color: #fff;
}

.option-text {
  flex: 1;
  line-height: 1.4;
}

.cloze-input-wrap {
  margin-top: 12px;
}

.cloze-input {
  width: 100%;
  padding: 12px 16px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 16px;
  font-family: inherit;
  background: #fafaf6;
  color: var(--ink);
  transition: all 0.15s;
}

.cloze-input:focus {
  outline: none;
  border-color: var(--primary);
  background: #fff;
}

.cloze-input.correct {
  border-color: var(--good);
  background: var(--accent-soft);
}

.cloze-input.wrong {
  border-color: var(--bad);
  background: #f5e1e1;
}

.cloze-input.disabled {
  cursor: not-allowed;
  background: #f0ece0;
}

.feedback {
  margin-top: 16px;
  padding: 14px 16px;
  border-radius: var(--radius-sm);
  display: none;
}

.feedback.show {
  display: block;
  animation: slideDown 0.25s ease;
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

.feedback.correct {
  background: var(--accent-soft);
  border: 1px solid var(--good);
  color: #2d4a2d;
}

.feedback.wrong {
  background: #f5e1e1;
  border: 1px solid var(--bad);
  color: #6a2828;
}

.feedback-header {
  font-weight: 700;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 15px;
}

.feedback-answer {
  font-size: 14px;
  margin-bottom: 6px;
}

.feedback-answer strong {
  color: var(--primary);
}

.feedback-explain {
  font-size: 14px;
  line-height: 1.6;
  background: rgba(255,255,255,0.6);
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  margin-top: 8px;
}

.feedback-explain .label {
  font-weight: 700;
  color: var(--primary);
  margin-right: 4px;
}

.quiz-actions {
  display: flex;
  gap: 12px;
  justify-content: flex-end;
  flex-wrap: wrap;
}

.btn-action {
  padding: 12px 24px;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 600;
  transition: all 0.15s;
}

.btn-primary {
  background: var(--primary);
  color: #fff;
}

.btn-primary:hover:not(:disabled) {
  background: var(--primary-dark);
}

.btn-primary:disabled {
  background: #d0c8b8;
  cursor: not-allowed;
}

.btn-secondary {
  background: var(--bg-card);
  color: var(--ink-soft);
  border: 1.5px solid var(--border);
}

.btn-secondary:hover {
  border-color: var(--primary);
  color: var(--primary);
}

/* ===== 结算页 ===== */
.result-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 40px 30px;
  text-align: center;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border);
}

.result-emoji {
  font-size: 64px;
  margin-bottom: 12px;
}

.result-card h2 {
  font-size: 28px;
  margin-bottom: 8px;
  color: var(--ink);
}

.result-card p {
  color: var(--ink-soft);
  font-size: 15px;
  margin-bottom: 24px;
}

.result-stats {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}

.result-stat {
  text-align: center;
}

.result-stat-num {
  font-size: 36px;
  font-weight: 800;
  line-height: 1;
}

.result-stat-num.good { color: var(--good); }
.result-stat-num.bad { color: var(--bad); }
.result-stat-num.neutral { color: var(--ink-soft); }

.result-stat-label {
  font-size: 12px;
  color: var(--ink-soft);
  margin-top: 4px;
}

.result-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}

/* ===== 响应式 ===== */
@media (max-width: 640px) {
  .header-inner {
    grid-template-columns: 1fr;
    text-align: center;
  }

  .book-badge {
    margin: 0 auto;
  }

  .hero-stats {
    justify-content: center;
  }

  .app-title {
    font-size: 28px;
  }

  .quiz-toolbar {
    flex-direction: column;
    align-items: stretch;
  }

  .btn-back, .quiz-info, .quiz-stats {
    justify-content: center;
  }

  .quiz-card {
    padding: 18px;
  }

  .question-text {
    font-size: 16px;
  }

  .quiz-actions {
    flex-direction: column-reverse;
  }

  .btn-action {
    width: 100%;
  }
}


/* ============================================
   增强响应式设计 - 手机完整自适应
   ============================================ */

/* 防止 iOS Safari 自动调整字号 */
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

/* 让 body 在 iPhone 刘海屏安全区域内显示 */
@supports (padding: max(0px)) {
  .app-header {
    padding-top: max(32px, env(safe-area-inset-top));
    padding-left: max(20px, env(safe-area-inset-left));
    padding-right: max(20px, env(safe-area-inset-right));
  }
  .app-main {
    padding-left: max(20px, env(safe-area-inset-left));
    padding-right: max(20px, env(safe-area-inset-right));
  }
  .app-footer {
    padding-bottom: max(18px, env(safe-area-inset-bottom));
  }
  .quiz-toolbar {
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
  }
}

/* 中等屏（平板，481-768px）*/
@media (max-width: 768px) {
  .app-header {
    padding: 24px 16px 22px;
  }
  .app-main {
    padding: 22px 16px 32px;
  }
  .app-title {
    font-size: 30px;
    letter-spacing: 1.5px;
  }
  .app-subtitle {
    font-size: 14px;
  }
  .book-badge {
    width: 96px;
    height: 130px;
    padding: 12px 8px;
  }
  .badge-title {
    font-size: 24px;
    letter-spacing: 3px;
  }
  .badge-sub {
    font-size: 8px;
  }
  .badge-author {
    font-size: 10px;
  }
  .header-inner {
    gap: 18px;
  }
  .hero-stats {
    gap: 12px;
  }
  .stat {
    min-width: 90px;
    padding: 6px 12px;
  }
  .stat-num {
    font-size: 20px;
  }
  .stat-label {
    font-size: 10px;
  }
  .chapter-grid {
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  .section-title h2 {
    font-size: 20px;
  }
  .section-title p {
    font-size: 13px;
  }
  .quiz-card {
    padding: 20px;
  }
  .question-text {
    font-size: 17px;
  }
  .option {
    padding: 11px 14px;
    font-size: 14px;
  }
  .option-letter {
    width: 26px;
    height: 26px;
    font-size: 13px;
  }
  .btn-action {
    padding: 11px 22px;
    font-size: 14px;
  }
  .feedback-explain {
    font-size: 13px;
  }
}

/* 小屏（手机，≤640px）*/
@media (max-width: 640px) {
  .app-header {
    padding: 22px 14px 20px;
  }
  .app-main {
    padding: 20px 14px 28px;
  }
  /* 头部纵向堆叠 */
  .header-inner {
    grid-template-columns: 1fr;
    text-align: center;
    gap: 16px;
  }
  .book-badge {
    margin: 0 auto;
    width: 88px;
    height: 120px;
    padding: 10px 8px;
    box-shadow: 3px 3px 0 var(--gold), 6px 6px 0 var(--primary-dark);
  }
  .badge-title {
    font-size: 22px;
    letter-spacing: 2px;
  }
  .badge-sub {
    font-size: 8px;
  }
  .badge-author {
    font-size: 10px;
  }
  .app-title {
    font-size: 26px;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .app-subtitle {
    font-size: 13px;
    margin-bottom: 14px;
  }
  .hero-stats {
    justify-content: center;
    gap: 8px;
  }
  .stat {
    min-width: 0;
    flex: 1 1 calc(33.333% - 8px);
    max-width: 120px;
    padding: 6px 8px;
  }
  .stat-num {
    font-size: 18px;
  }
  .stat-label {
    font-size: 9px;
    line-height: 1.2;
  }
  /* 章节卡片：手机上一列 */
  .chapter-grid {
    grid-template-columns: 1fr;
    gap: 10px;
  }
  .chapter-card {
    padding: 14px 16px 12px;
  }
  .chapter-num {
    font-size: 10px;
  }
  .chapter-title {
    font-size: 15px;
  }
  .chapter-sub {
    font-size: 12px;
  }
  .section-title {
    margin-bottom: 16px;
  }
  .section-title h2 {
    font-size: 18px;
  }
  .section-title p {
    font-size: 12px;
  }
  .footer-tip {
    margin-top: 22px;
    padding: 12px;
    font-size: 12px;
  }
  /* 答题工具栏：纵向堆叠 */
  .quiz-toolbar {
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
    padding: 10px 12px;
    margin-bottom: 14px;
  }
  .btn-back {
    justify-content: center;
    padding: 8px 10px;
    font-size: 13px;
  }
  .back-arrow {
    font-size: 16px;
  }
  .quiz-info {
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .chapter-tag {
    font-size: 11px;
    padding: 3px 8px;
  }
  .quiz-progress {
    font-size: 13px;
  }
  .quiz-stats {
    justify-content: center;
    gap: 14px;

          "C. 33 × 100 = 3300",
          "D. 123 × 9（9 ≈ 10）"
        ],
        answer: [0, 1, 3],
        explain: "A: 76×99=7600-76=7524（×100减自己）；B: 88×101=8800+88=8888（×100加自己）；C 不用凑整；D: 123×9=1230-123=1107。全对（除 C）！"
      }
    ],
    [
      {
        type: "single",
        text: "综合应用 4：计算 11 × 11，下面哪种最快？",
        options: [
          "A. 11×11 = 121",
          "B. 1_1, 中间 1+1=2, 得 121",
          "C. 11×11 = 10×11+11 = 121",
          "D. 都对"
        ],
        answer: 3,
        explain: "11×11 = 121，用 ×11 的'两拉开'口诀：1_1, 中间 1+1=2, 得 121。要记熟常见的平方数！"
      },
      {
        type: "cloze",
        text: "综合应用 5：计算 7 × 7 × 7 × 7：注意到 7×7=49, 49×49 = (50-1)(50+1) = ____, 所以 7⁴ = 2401。",
        options: [],
        answer: 2499,
        explain: "7×7=49, 49×49 = 50²-1 = 2500-1 = 2499。所以 7⁴ = 2499。这种'平方差'的思路在连续平方时特别好用！"
      },
      {
        type: "multi",
        text: "综合应用 6：关于速算思维，下面说法正确的有？（多选）",
        options: [
          "A. 任何复杂的数都可以拆分成简单的数",
          "B. 凑整是万能的'第一反应'",
          "C. 学了速算后，普通方法可以扔掉",
          "D. 速算是数学思维训练的一部分"
        ],
        answer: [0, 1, 3],
        explain: "A、B、D 都是核心思想；C 错误——普通方法是基础，速算是工具，两者结合才是最好的数学能力！"
      }
    ]
  ]
};



// ===== app.js =====
/* ============================================
   《算得快》练习题 - 交互逻辑
   ============================================ */

const App = {
  state: {
    chapterId: null,
    questionSet: [],     // 当前套 3 道题
    currentIndex: 0,     // 当前题号
    correctCount: 0,
    wrongCount: 0,
    submitted: false,
    userAnswer: null,    // 当前用户答案
  },

  // ----- 工具 -----
  $(sel) { return document.querySelector(sel); },
  $$(sel) { return document.querySelectorAll(sel); },

  // 从题库随机抽 1 套（3 道题）
  pickQuestionSet(chapterId) {
    const sets = QUESTIONS[chapterId];
    if (!sets || sets.length === 0) return null;
    const idx = Math.floor(Math.random() * sets.length);
    return sets[idx];
  },

  // 打乱 4 选 1 的选项顺序（保留正确索引）
  shuffleOptions(question) {
    if (question.type !== "single" && question.type !== "multi") return question;
    const indexed = question.options.map((text, i) => ({ text, isCorrect: i }));
    // Fisher-Yates
    for (let i = indexed.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [indexed[i], indexed[j]] = [indexed[j], indexed[i]];
    }
    return {
      ...question,
      options: indexed.map(x => x.text),
      _shuffledCorrect: indexed.map(x => x.isCorrect),
    };
  },

  // ----- 视图切换 -----
  showView(name) {
    ["chapterView", "quizView", "resultView"].forEach(v => {
      this.$("#" + v).hidden = (v !== name);
    });
    window.scrollTo({ top: 0, behavior: "smooth" });
  },

  // ----- 章节页 -----
  renderChapters() {
    const grid = this.$("#chapterGrid");
    grid.innerHTML = "";
    CHAPTERS.forEach((ch) => {
      const card = document.createElement("div");
      card.className = "chapter-card";
      const stars = "★".repeat(ch.difficulty) + "☆".repeat(5 - ch.difficulty);
      card.innerHTML = `
        <div class="chapter-num">${ch.num}</div>
        <div class="chapter-title">${ch.title}</div>
        <div class="chapter-sub">${ch.sub}</div>
        <div class="chapter-difficulty" title="难度 ${ch.difficulty}/5">${[1,2,3,4,5].map(i =>
          `<span class="star ${i <= ch.difficulty ? '' : 'empty'}">★</span>`
        ).join("")}</div>
      `;
      card.addEventListener("click", () => this.startQuiz(ch.id));
      grid.appendChild(card);
    });
  },

  // ----- 答题页 -----
  startQuiz(chapterId) {
    const set = this.pickQuestionSet(chapterId);
    if (!set) return;
    // 打乱选项
    this.state.chapterId = chapterId;
    this.state.questionSet = set.map(q => this.shuffleOptions(q));
    this.state.currentIndex = 0;
    this.state.correctCount = 0;
    this.state.wrongCount = 0;
    this.state.submitted = false;
    this.state.userAnswer = null;
    const chapter = CHAPTERS.find(c => c.id === chapterId);
    this.$("#quizChapterTag").textContent = chapter.num + " · " + chapter.title;
    this.$("#correctCount").textContent = "0";
    this.$("#wrongCount").textContent = "0";
    this.showView("quizView");
    this.renderQuestion();
  },

  renderQuestion() {
    const q = this.state.questionSet[this.state.currentIndex];
    const idx = this.state.currentIndex;
    const total = this.state.questionSet.length;
    this.$("#quizProgress").textContent = `第 ${idx + 1} / ${total} 题`;

    const card = this.$("#quizCard");
    let typeLabel = q.type === "cloze" ? "完形填空" : q.type === "single" ? "单选题" : "多选题";
    let typeClass = q.type === "cloze" ? "type-cloze" : q.type === "single" ? "type-single" : "type-multi";

    let html = `<span class="question-type ${typeClass}">${typeLabel}</span>`;
    html += `<div class="question-text">${q.text}</div>`;

    if (q.type === "cloze") {
      html += `<div class="cloze-input-wrap">
        <input type="text" class="cloze-input" id="clozeInput" placeholder="在此输入答案" autocomplete="off" />
      </div>`;
    } else if (q.type === "single") {
      html += `<div class="options" id="singleOptions">`;
      q.options.forEach((opt, i) => {
        html += `<div class="option" data-i="${i}">
          <span class="option-letter">${String.fromCharCode(65 + i)}</span>
          <span class="option-text">${opt}</span>
        </div>`;
      });
      html += `</div>`;
    } else if (q.type === "multi") {
      html += `<div class="options" id="multiOptions" data-multi="true">`;
      q.options.forEach((opt, i) => {
        html += `<div class="option" data-i="${i}">
          <span class="option-letter">${String.fromCharCode(65 + i)}</span>
          <span class="option-text">${opt}</span>
        </div>`;
      });
      html += `<div style="font-size:12px;color:var(--ink-soft);margin-top:4px;">提示：多选，可选 2 项或更多</div></div>`;
    }

    html += `<div class="feedback" id="feedback"></div>`;
    card.innerHTML = html;

    // 绑定选项点击
    if (q.type === "single") {
      this.$$("#singleOptions .option").forEach(el => {
        el.addEventListener("click", () => {
          if (this.state.submitted) return;
          this.$$("#singleOptions .option").forEach(e => e.classList.remove("selected"));
          el.classList.add("selected");
          this.state.userAnswer = parseInt(el.dataset.i);
          this.$("#btnSubmit").disabled = false;
        });
      });
    } else if (q.type === "multi") {
      this.$$("#multiOptions .option").forEach(el => {
        el.addEventListener("click", () => {
          if (this.state.submitted) return;
          el.classList.toggle("selected");
          const selected = Array.from(this.$$("#multiOptions .option.selected")).map(e => parseInt(e.dataset.i));
          this.state.userAnswer = selected;
          this.$("#btnSubmit").disabled = selected.length === 0;
        });
      });
    } else if (q.type === "cloze") {
      const input = this.$("#clozeInput");
      input.focus();
      input.addEventListener("input", () => {
        this.state.userAnswer = input.value.trim();
        this.$("#btnSubmit").disabled = input.value.trim() === "";
      });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !this.$("#btnSubmit").disabled && !this.state.submitted) {
          this.submit();
        }
      });
    }

    // 按钮状态
    this.state.submitted = false;
    this.state.userAnswer = null;
    this.$("#btnSubmit").hidden = false;
    this.$("#btnSubmit").disabled = true;
    this.$("#btnNext").hidden = true;
    this.$("#btnGiveUp").disabled = false;
  },

  // 判断答案
  checkAnswer(q) {
    if (q.type === "cloze") {
      const user = String(this.state.userAnswer || "").trim();
      const correct = String(q.answer);
      // 数字/字符串都允许
      if (user === correct) return true;
      // 如果答案是数字，也接受数字输入
      if (!isNaN(parseFloat(correct)) && !isNaN(parseFloat(user))) {
        return parseFloat(user) === parseFloat(correct);
      }
      // 处理 "413, 413" 这种逗号分隔的多空情况
      if (correct.includes(",")) {
        const userParts = user.split(/[,，\s]+/).map(s => s.trim());
        const correctParts = correct.split(",").map(s => s.trim());
        if (userParts.length === correctParts.length) {
          return userParts.every((p, i) => p === correctParts[i]);
        }
      }
      return false;
    } else if (q.type === "single") {
      return this.state.userAnswer === q._shuffledCorrect.findIndex(x => x === q.answer);
      // 注意：q.answer 是原始索引（0-based）
      // 实际：q.answer 是原始选项的索引，_shuffledCorrect 给出每个新位置的原始索引
    } else if (q.type === "multi") {
      // q.answer 是原始选项索引数组
      // _shuffledCorrect 给出每个新位置的原始索引
      const correctOriginal = q.answer;  // 数组，如 [0, 2]
      const userSelected = this.state.userAnswer;  // 用户点击的新位置索引
      // 把用户选的新位置转成原始位置
      const userOriginal = userSelected.map(newIdx => q._shuffledCorrect[newIdx]);
      // 排序后比较
      return correctOriginal.length === userOriginal.length &&
             correctOriginal.every(v => userOriginal.includes(v));
    }
    return false;
  },

  // 取得正确选项的展示文字
  getCorrectDisplay(q) {
    if (q.type === "cloze") {
      return String(q.answer);
    } else if (q.type === "single") {
      // 找到 _shuffledCorrect 中值为 q.answer 的位置
      const newIdx = q._shuffledCorrect.findIndex(orig => orig === q.answer);
      return `${String.fromCharCode(65 + newIdx)}. ${q.options[newIdx]}`;
    } else if (q.type === "multi") {
      const letters = q.answer
        .map(origIdx => {
          const newIdx = q._shuffledCorrect.findIndex(o => o === origIdx);
          return String.fromCharCode(65 + newIdx);
        })
        .sort()
        .join("、");
      return letters;
    }
  },

  // 提交答案
  submit() {
    const q = this.state.questionSet[this.state.currentIndex];
    const isCorrect = this.checkAnswer(q);
    this.state.submitted = true;
    const correct = isCorrect;
    if (correct) this.state.correctCount++;
    else this.state.wrongCount++;
    this.$("#correctCount").textContent = this.state.correctCount;
    this.$("#wrongCount").textContent = this.state.wrongCount;

    // 渲染反馈
    const feedback = this.$("#feedback");
    feedback.className = "feedback show " + (correct ? "correct" : "wrong");
    feedback.innerHTML = `
      <div class="feedback-header">${correct ? "🎉 答对啦！" : "😅 还差一点~"}</div>
      <div class="feedback-answer">正确答案：<strong>${this.getCorrectDisplay(q)}</strong></div>
      <div class="feedback-explain">
        <span class="label">解题思路：</span>${q.explain}
      </div>
    `;

    // 标记选项
    if (q.type === "single") {
      this.$$("#singleOptions .option").forEach((el, i) => {
        el.classList.add("disabled");
        if (q._shuffledCorrect[i] === q.answer) el.classList.add("correct");
        if (i === this.state.userAnswer && !correct) el.classList.add("wrong");
      });
    } else if (q.type === "multi") {
      this.$$("#multiOptions .option").forEach((el, i) => {
        el.classList.add("disabled");
        if (q.answer.includes(q._shuffledCorrect[i])) el.classList.add("correct");
        if (this.state.userAnswer.includes(i) && !q.answer.includes(q._shuffledCorrect[i])) {
          el.classList.add("wrong");
        }
      });
    } else if (q.type === "cloze") {
      const input = this.$("#clozeInput");
      input.classList.add(correct ? "correct" : "wrong");
      input.classList.add("disabled");
      input.disabled = true;
    }

    // 切换按钮
    this.$("#btnSubmit").hidden = true;
    this.$("#btnGiveUp").disabled = true;
    const isLast = this.state.currentIndex === this.state.questionSet.length - 1;
    this.$("#btnNext").hidden = false;
    this.$("#btnNext").textContent = isLast ? "查看成绩 →" : "下一题 →";
  },

  // 不会做，直接看解析
  giveUp() {
    const q = this.state.questionSet[this.state.currentIndex];
    this.state.submitted = true;
    this.state.wrongCount++;
    this.$("#wrongCount").textContent = this.state.wrongCount;

    const feedback = this.$("#feedback");
    feedback.className = "feedback show wrong";
    feedback.innerHTML = `
      <div class="feedback-header">🤔 没关系，看看解析学一学！</div>
      <div class="feedback-answer">正确答案：<strong>${this.getCorrectDisplay(q)}</strong></div>
      <div class="feedback-explain">
        <span class="label">解题思路：</span>${q.explain}
      </div>
    `;

    if (q.type === "single") {
      this.$$("#singleOptions .option").forEach((el, i) => {
        el.classList.add("disabled");
        if (q._shuffledCorrect[i] === q.answer) el.classList.add("correct");
      });
    } else if (q.type === "multi") {
      this.$$("#multiOptions .option").forEach((el, i) => {
        el.classList.add("disabled");
        if (q.answer.includes(q._shuffledCorrect[i])) el.classList.add("correct");
      });
    } else if (q.type === "cloze") {
      const input = this.$("#clozeInput");
      input.classList.add("wrong");
      input.classList.add("disabled");
      input.disabled = true;
    }

    this.$("#btnSubmit").hidden = true;
    this.$("#btnGiveUp").disabled = true;
    const isLast = this.state.currentIndex === this.state.questionSet.length - 1;
    this.$("#btnNext").hidden = false;
    this.$("#btnNext").textContent = isLast ? "查看成绩 →" : "下一题 →";
  },

  // 下一题
  next() {
    if (this.state.currentIndex < this.state.questionSet.length - 1) {
      this.state.currentIndex++;
      this.renderQuestion();
    } else {
      this.showResult();
    }
  },

  // 结算页
  showResult() {
    const total = this.state.questionSet.length;
    const correct = this.state.correctCount;
    const wrong = this.state.wrongCount;
    const chapter = CHAPTERS.find(c => c.id === this.state.chapterId);

    let emoji, title, desc;
    if (correct === total) {
      emoji = "🏆"; title = "全对！你太棒了！";
      desc = `《${chapter.title}》这一章你已经掌握啦，速算小达人！`;
    } else if (correct >= 1) {
      emoji = "👍"; title = "不错的开始！";
      desc = `答对 ${correct} 道，再多练几次就能全对啦！`;
    } else {
      emoji = "💪"; title = "别灰心，再来一次！";
      desc = `先看书里的故事，再来刷题会容易很多哦！`;
    }

    this.$("#resultEmoji").textContent = emoji;
    this.$("#resultTitle").textContent = title;
    this.$("#resultDesc").textContent = desc;
    this.$("#resultStats").innerHTML = `
      <div class="result-stat">
        <div class="result-stat-num good">${correct}</div>
        <div class="result-stat-label">答对</div>
      </div>
      <div class="result-stat">
        <div class="result-stat-num bad">${wrong}</div>
        <div class="result-stat-label">答错/跳过</div>
      </div>
      <div class="result-stat">
        <div class="result-stat-num neutral">${total}</div>
        <div class="result-stat-label">总题数</div>
      </div>
    `;
    this.showView("resultView");
  },

  // ----- 初始化 -----
  init() {
    this.renderChapters();

    this.$("#btnBack").addEventListener("click", () => this.showView("chapterView"));
    this.$("#btnSubmit").addEventListener("click", () => this.submit());
    this.$("#btnGiveUp").addEventListener("click", () => this.giveUp());
    this.$("#btnNext").addEventListener("click", () => this.next());
    this.$("#btnRetry").addEventListener("click", () => this.startQuiz(this.state.chapterId));
    this.$("#btnHome").addEventListener("click", () => this.showView("chapterView"));

    // 支持 URL hash 直接开始某章节，例如 #1 或 #chapter-1
    const hash = window.location.hash.replace("#", "");
    if (hash) {
      const m = hash.match(/^(?:chapter-)?(\d+)$/);
      if (m) {
        const id = parseInt(m[1]);
        if (QUESTIONS[id]) {
          setTimeout(() => this.startQuiz(id), 100);
        }
      }
    }
  },
};

document.addEventListener("DOMContentLoaded", () => App.init());

  </script>
